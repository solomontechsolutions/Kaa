# Supabase CLI configuration for Kaa.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "kaa"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://kaa.co.tz", "https://www.kaa.co.tz"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Kaa signs people in by phone. Email is a fallback for operator staff only.
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
# Tanzanian numbers only at launch.
template = "Namba yako ya Kaa ni {{ .Code }}. Usimpe mtu yeyote."

[inbound_sms]
enabled = false

[analytics]
enabled = false
